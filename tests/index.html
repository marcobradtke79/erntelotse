<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Erntelotse tests</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; line-height: 1.5; }
      h1.pass, li.pass { color: #187533; }
      h1.fail, li.fail { color: #C62F3B; }
      h2 { font-size: 16px; margin: 20px 0 4px; }
      ul { list-style: none; padding: 0; margin: 0; }
      pre { white-space: pre-wrap; background: #fbeaea; color: #2B2A33; padding: 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="results"></div>
    <script type="module">
      import { run, setFile } from './harness.js';
      import { TEST_FILES } from './files.js';

      for (const file of TEST_FILES) {
        setFile(file);
        await import(`./${file}`);
      }
      await run(document.getElementById('results'));
    </script>
  </body>
</html>
